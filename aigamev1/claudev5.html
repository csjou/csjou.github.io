<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR 射擊遊戲</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }

    #overlay-menu {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 999;
      background: rgba(5,5,20,0.72);
      backdrop-filter: blur(2px);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
    }
    #overlay-menu h1 {
      margin: 0 0 4px;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 900; letter-spacing: 0.12em;
      color: #00ffcc;
      text-shadow: 0 0 24px #00ffcc99, 0 0 60px #00ffcc44;
    }
    #overlay-menu .sub {
      font-size: clamp(0.75rem, 3vw, 1rem);
      letter-spacing: 0.35em; color: #ffffff55;
      margin-bottom: 48px; text-transform: uppercase;
    }
    #overlay-menu .hint {
      margin-top: 32px;
      font-size: clamp(0.7rem, 2.5vw, 0.85rem);
      color: #ffffff33; letter-spacing: 0.08em;
    }
    #start-btn {
      padding: 16px 52px;
      font-size: clamp(1rem, 4vw, 1.35rem);
      font-weight: 700; letter-spacing: 0.2em;
      color: #00ffcc; background: transparent;
      border: 2px solid #00ffcc; border-radius: 4px;
      cursor: pointer; text-transform: uppercase;
      box-shadow: 0 0 18px #00ffcc55, inset 0 0 18px #00ffcc11;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
    }
    #start-btn:hover {
      background: #00ffcc22;
      box-shadow: 0 0 32px #00ffccaa, inset 0 0 24px #00ffcc22;
      transform: scale(1.04);
    }
    #start-btn:active { transform: scale(0.97); }

    /* HUD */
    #hud {
      position: fixed; top: 20px; left: 0; right: 0;
      display: none; justify-content: center;
      z-index: 100; pointer-events: none;
    }
    #score-display {
      background: rgba(0,0,0,0.55); color: #00ffcc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 1.3rem; font-weight: 700; letter-spacing: 0.1em;
      padding: 8px 32px; border-radius: 32px;
      border: 1.5px solid #00ffcc55;
      text-shadow: 0 0 10px #00ffcc88;
      transition: transform 0.1s;
    }
    #score-display.pop {
      transform: scale(1.22);
      color: #ffff00;
      text-shadow: 0 0 16px #ffff00;
    }

    /* 得分浮動文字 */
    #score-popup {
      position: fixed; top: 38%; left: 50%;
      transform: translateX(-50%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 2rem; font-weight: 900;
      color: #ffff00;
      text-shadow: 0 0 16px #ffff0099;
      pointer-events: none;
      z-index: 300;
      opacity: 0;
      transition: opacity 0.1s;
    }

    /* 準心 */
    #crosshair {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 36px; height: 36px;
      z-index: 200; pointer-events: none; display: none;
    }
    #crosshair .ring {
      position: absolute; inset: 0;
      border: 2px solid rgba(0,255,204,0.75);
      border-radius: 50%; box-shadow: 0 0 8px #00ffcc88;
    }
    #crosshair .dot {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 5px; height: 5px;
      background: #00ffcc; border-radius: 50%;
      box-shadow: 0 0 6px #00ffcc;
    }
    #crosshair .gaze-ring {
      position: absolute; inset: -5px;
      width: calc(100% + 10px); height: calc(100% + 10px);
    }
    #crosshair.gazing .ring { border-color: #ffff00; box-shadow: 0 0 12px #ffff0099; }
    #crosshair.gazing .dot { background: #ffff00; box-shadow: 0 0 8px #ffff00; }
  </style>
</head>
<body>

  <div id="overlay-menu">
    <h1>⚡ VR 射擊遊戲</h1>
    <div class="sub">Cyber Shooter</div>
    <button id="start-btn">▶ &nbsp;開始遊戲</button>
    <div class="hint">凝視目標 2 秒即可擊碎 · 競速計分</div>
  </div>

  <div id="hud">
    <div id="score-display">分數：<span id="score-value">0</span></div>
  </div>

  <div id="score-popup">+10</div>

  <div id="crosshair">
    <div class="ring"></div>
    <div class="dot"></div>
    <svg class="gaze-ring" viewBox="0 0 46 46">
      <circle id="gaze-arc-el"
        cx="23" cy="23" r="20" fill="none"
        stroke="#ffff00" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="125.66" stroke-dashoffset="125.66"
        opacity="0.9"
        style="transform: rotate(-90deg); transform-origin: center;"
      />
    </svg>
  </div>

  <a-scene
    background="color: #080818"
    fog="type: exponential; color: #080818; density: 0.02"
    renderer="antialias: true"
    vr-mode-ui="enabled: true"
  >
    <a-entity light="type: ambient; color: #1a1a3e; intensity: 1.0"></a-entity>
    <a-entity light="type: directional; color: #6688ff; intensity: 1.4" position="-3 6 -4"></a-entity>
    <a-entity light="type: point; color: #00ffcc; intensity: 2; distance: 25; decay: 2" position="0 4 0"></a-entity>
    <a-entity light="type: point; color: #ff44aa; intensity: 1.2; distance: 20; decay: 2" position="6 1 -6"></a-entity>

    <a-entity
      geometry="primitive: plane; width: 80; height: 80"
      material="color: #08081a; roughness: 1"
      rotation="-90 0 0" position="0 -1.6 0"
    ></a-entity>
    <a-entity
      geometry="primitive: plane; width: 40; height: 40"
      material="color: #00ffcc; opacity: 0.07; transparent: true; wireframe: true"
      rotation="-90 0 0" position="0 -1.59 0"
    ></a-entity>

    <a-entity id="stars"></a-entity>
    <a-entity id="targets-container"></a-entity>

    <a-entity id="rig" position="0 0 0">
      <a-camera
        id="main-camera"
        look-controls="pointerLockEnabled: false"
        wasd-controls="enabled: false"
        position="0 1.6 0"
        raycaster="objects: .target; far: 30; interval: 60;"
        cursor="fuse: false; rayOrigin: entity;"
      ></a-camera>
    </a-entity>
  </a-scene>

  <script>
    // ── 星空 ──
    (function () {
      const container = document.getElementById('stars');
      for (let i = 0; i < 150; i++) {
        const s = document.createElement('a-sphere');
        const r = 38 + Math.random() * 8;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        s.setAttribute('radius', (0.02 + Math.random() * 0.05).toFixed(3));
        s.setAttribute('color', '#ccccff');
        s.setAttribute('material', 'shader: flat; opacity: ' + (0.4 + Math.random() * 0.6).toFixed(2));
        s.setAttribute('position', {
          x: +(r * Math.sin(phi) * Math.cos(theta)).toFixed(2),
          y: +(r * Math.cos(phi)).toFixed(2),
          z: +(r * Math.sin(phi) * Math.sin(theta)).toFixed(2),
        });
        container.appendChild(s);
      }
    })();

    // ── 遊戲狀態 ──
    const GameState = {
      score: 0,
      isPlaying: false,
      spawnTimer: null,
      gazeTarget: null,   // 目前凝視的目標 el
      gazeStart: null,    // 凝視開始時間 (ms)
      gazeRAF: null,      // requestAnimationFrame id
      GAZE_DURATION: 2000 // 2 秒擊碎
    };

    // ── 準心控制器 ──
    const Crosshair = {
      el: document.getElementById('crosshair'),
      arc: document.getElementById('gaze-arc-el'),
      CIRCUMFERENCE: 125.66,
      show() { this.el.style.display = 'block'; },
      setProgress(p) {
        this.arc.setAttribute('stroke-dashoffset', this.CIRCUMFERENCE * (1 - p));
        p > 0 ? this.el.classList.add('gazing') : this.el.classList.remove('gazing');
      },
      reset() { this.setProgress(0); }
    };

    // ── 目標物設定 ──
    const TARGET_COLORS = ['#ff4466','#ff9900','#aa44ff','#00ccff','#ffee00'];
    const TARGET_SHAPES = ['box','sphere','dodecahedron','octahedron'];
    function rand(min, max) { return min + Math.random() * (max - min); }

    function spawnTarget() {
      if (!GameState.isPlaying) return;
      const container = document.getElementById('targets-container');
      if (container.children.length >= 12) return;

      const shape = TARGET_SHAPES[Math.floor(Math.random() * TARGET_SHAPES.length)];
      const color = TARGET_COLORS[Math.floor(Math.random() * TARGET_COLORS.length)];
      const size  = rand(0.25, 0.6);
      const angle = rand(0, Math.PI * 2);
      const dist  = rand(3, 9);
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist - 2;
      const y = rand(0.5, 3.5);

      const target = document.createElement('a-entity');
      target.setAttribute('id', 'target-' + Date.now() + '-' + Math.floor(Math.random() * 9999));
      target.setAttribute('class', 'target');
      target.setAttribute('geometry', `primitive: ${shape}; ${
        shape === 'box'
          ? `width: ${size}; height: ${size}; depth: ${size}`
          : `radius: ${(size * 0.55).toFixed(3)}`
      }`);
      target.setAttribute('material',
        `color: ${color}; emissive: ${color}; emissiveIntensity: 0.35; roughness: 0.3; metalness: 0.6`
      );
      target.setAttribute('position', `${x.toFixed(2)} ${y.toFixed(2)} ${z.toFixed(2)}`);
      target.setAttribute('animation__rot',
        `property: rotation; to: ${rand(0,360).toFixed(0)} ${rand(0,360).toFixed(0)} ${rand(0,360).toFixed(0)};
         loop: true; dur: ${rand(1800,4000).toFixed(0)}; easing: linear;`
      );
      const floatAmp = rand(0.15, 0.35);
      target.setAttribute('animation__float',
        `property: position;
         to: ${x.toFixed(2)} ${(y + floatAmp).toFixed(2)} ${z.toFixed(2)};
         dir: alternate; loop: true; dur: ${rand(1600,3000).toFixed(0)}; easing: easeInOutSine;`
      );
      const glow = document.createElement('a-entity');
      glow.setAttribute('light', `type: point; color: ${color}; intensity: 0.8; distance: 4; decay: 2`);
      target.appendChild(glow);

      container.appendChild(target);
    }

    function startSpawning() {
      for (let i = 0; i < 5; i++) spawnTarget();
      GameState.spawnTimer = setInterval(spawnTarget, 2000);
    }

    // ══════════════════════════════
    // 爆炸粒子效果
    // ══════════════════════════════
    function spawnExplosion(position, color) {
      const container = document.getElementById('targets-container');
      const count = 10;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('a-sphere');
        p.setAttribute('radius', rand(0.04, 0.12).toFixed(3));
        p.setAttribute('material', `color: ${color}; emissive: ${color}; emissiveIntensity: 0.8; shader: flat`);
        p.setAttribute('position', `${position.x} ${position.y} ${position.z}`);

        // 隨機飛散方向
        const tx = position.x + rand(-2, 2);
        const ty = position.y + rand(0.2, 2.5);
        const tz = position.z + rand(-2, 2);
        p.setAttribute('animation__move',
          `property: position; to: ${tx.toFixed(2)} ${ty.toFixed(2)} ${tz.toFixed(2)};
           dur: 600; easing: easeOutQuad;`
        );
        p.setAttribute('animation__fade',
          `property: material.opacity; from: 1; to: 0;
           dur: 600; easing: easeInQuad;`
        );
        container.appendChild(p);
        // 600ms 後移除粒子
        setTimeout(() => { if (p.parentNode) p.parentNode.removeChild(p); }, 650);
      }
    }

    // ══════════════════════════════
    // 擊碎目標
    // ══════════════════════════════
    function destroyTarget(targetEl) {
      if (!targetEl || !targetEl.parentNode) return;

      // 取得位置與顏色做爆炸效果
      const pos = targetEl.object3D.position;
      const mat = targetEl.getAttribute('material') || {};
      const color = mat.color || '#ffffff';

      spawnExplosion({ x: pos.x, y: pos.y, z: pos.z }, color);

      // 縮小動畫後移除
      targetEl.setAttribute('animation__destroy',
        `property: scale; to: 0 0 0; dur: 200; easing: easeInBack;`
      );
      setTimeout(() => {
        if (targetEl.parentNode) targetEl.parentNode.removeChild(targetEl);
      }, 220);

      // 計分
      GameState.score += 10;
      document.getElementById('score-value').textContent = GameState.score;

      // 分數跳動動畫
      const scoreEl = document.getElementById('score-display');
      scoreEl.classList.add('pop');
      setTimeout(() => scoreEl.classList.remove('pop'), 250);

      // 浮動 +10 文字
      showScorePopup('+10');
    }

    function showScorePopup(text) {
      const el = document.getElementById('score-popup');
      el.textContent = text;
      el.style.opacity = '1';
      el.style.transform = 'translateX(-50%) translateY(0px)';
      el.style.transition = 'opacity 0.1s, transform 0.1s';
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(-50%) translateY(-30px)';
        el.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
      }, 300);
    }

    // ══════════════════════════════
    // 凝視計時迴圈 (rAF)
    // ══════════════════════════════
    function gazeLoop() {
      if (!GameState.gazeTarget || !GameState.isPlaying) return;

      const elapsed = performance.now() - GameState.gazeStart;
      const progress = Math.min(elapsed / GameState.GAZE_DURATION, 1);
      Crosshair.setProgress(progress);

      if (progress >= 1) {
        // 達到 2 秒 → 擊碎
        const hit = GameState.gazeTarget;
        GameState.gazeTarget = null;
        GameState.gazeStart = null;
        Crosshair.reset();
        destroyTarget(hit);
        return; // 不再繼續此次 rAF 循環
      }

      GameState.gazeRAF = requestAnimationFrame(gazeLoop);
    }

    // ══════════════════════════════
    // A-Frame 場景事件
    // ══════════════════════════════
    document.querySelector('a-scene').addEventListener('loaded', function () {
      const camera = document.getElementById('main-camera');

      // 準心進入目標
      camera.addEventListener('raycaster-intersection', function (e) {
        if (!GameState.isPlaying) return;
        const firstHit = e.detail.els[0];
        if (!firstHit || !firstHit.classList.contains('target')) return;

        // 如果換了目標，重置計時
        if (GameState.gazeTarget !== firstHit) {
          cancelAnimationFrame(GameState.gazeRAF);
          GameState.gazeTarget = firstHit;
          GameState.gazeStart = performance.now();
          gazeLoop();
        }
      });

      // 準心離開目標
      camera.addEventListener('raycaster-intersection-cleared', function () {
        cancelAnimationFrame(GameState.gazeRAF);
        GameState.gazeTarget = null;
        GameState.gazeStart = null;
        Crosshair.reset();
      });
    });

    // ── 開始按鈕 ──
    document.getElementById('start-btn').addEventListener('click', function () {
      document.getElementById('overlay-menu').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      Crosshair.show();

      GameState.score = 0;
      GameState.isPlaying = true;
      document.getElementById('score-value').textContent = '0';

      startSpawning();
    });
  </script>
</body>
</html>
