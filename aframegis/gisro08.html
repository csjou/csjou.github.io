<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSM + A-Frame 3D 汽車頭尾燈與 Glow 發光效果</title>

  <!-- 1. Leaflet.js 地圖庫 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 2. A-Frame 3D 框架 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #050508;
      perspective: 1000px;
      perspective-origin: 50% 65%;
    }

    #map-wrapper {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      transform-origin: 50% 50%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    #map {
      width: 100%;
      height: 100%;
      /* 濾鏡效果：將 OSM 地圖調暗為深色夜間模式，讓車燈更突出 */
      filter: brightness(0.6) contract(1.2) invert(0.9) hue-rotate(200deg);
    }

    #aframe-overlay {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    .nav-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      padding: 12px 24px;
      background-color: #E11D48;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button class="nav-btn" onclick="startNavigationAnimation()">開啟夜間車燈導航</button>

  <div id="map-wrapper">
    <div id="map"></div>
  </div>

  <div id="aframe-overlay">
    <a-scene embedded vr-mode-ui="enabled: false" style="background: transparent;">
      <a-assets>
        <a-asset-item id="car-model" src="assets/car.glb"></a-asset-item>
      </a-assets>

      <!-- 3D 汽車與全套車燈組合體 -->
      <a-entity id="nav-car" visible="false">
        <!-- 3D 汽車模型 -->
        <a-gltf-model src="#car-model" scale="20 20 20" rotation="90 0 0"></a-gltf-model>

        <!-- 車頭燈光的照射目標 (位於車頭前方) -->
        <a-entity id="headlight-target" position="0 -60 0"></a-entity>

        <!-- 左頭燈 (Spotlight) -->
        <a-entity light="type: spot; color: #FFFEE0; intensity: 4; angle: 35; penumbra: 0.4; distance: 120; target: #headlight-target" 
                  position="-4 -6 3">
        </a-entity>
        <!-- 右頭燈 (Spotlight) -->
        <a-entity light="type: spot; color: #FFFEE0; intensity: 4; angle: 35; penumbra: 0.4; distance: 120; target: #headlight-target" 
                  position="4 -6 3">
        </a-entity>

        <!-- 左/右頭燈 Glow 發光燈泡 -->
        <a-sphere radius="1.5" position="-4 -5.5 2.5" material="shader: flat; color: #FFFFFF; emissive: #FFFFFF; emissiveIntensity: 3"></a-sphere>
        <a-sphere radius="1.5" position="4 -5.5 2.5" material="shader: flat; color: #FFFFFF; emissive: #FFFFFF; emissiveIntensity: 3"></a-sphere>

        <!-- 左/右尾燈 Glow 紅光 -->
        <a-box depth="1.5" height="1" width="1.8" position="-4.5 5.5 2.5" material="shader: flat; color: #FF0000; emissive: #FF0000; emissiveIntensity: 4"></a-box>
        <a-box depth="1.5" height="1" width="1.8" position="4.5 5.5 2.5" material="shader: flat; color: #FF0000; emissive: #FF0000; emissiveIntensity: 4"></a-box>
      </a-entity>

      <!-- 基本微弱環境光，模擬夜間大氣光 -->
      <a-light type="ambient" color="#223" intensity="0.5"></a-light>
      <a-camera id="aframe-camera" orthographic position="0 0 1000" near="0.1" far="2000"></a-camera>
    </a-scene>
  </div>

  <script>
    const hsingWuCoord = [25.0792, 121.3965];
    const linkouBusCoord = [25.0645, 121.3625];

    const map = L.map('map', { zoomControl: false }).setView(hsingWuCoord, 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    L.marker(hsingWuCoord).addTo(map).bindPopup('<b>起點：醒吾科技大學</b>');
    L.marker(linkouBusCoord).addTo(map).bindPopup('<b>終點：林口轉運站</b>');

    let routePolyline = null;
    let isAnimating = false;

    function calculateBearing(lat1, lng1, lat2, lng2) {
      const rad = Math.PI / 180;
      const phi1 = lat1 * rad;
      const phi2 = lat2 * rad;
      const deltaLambda = (lng2 - lng1) * rad;

      const y = Math.sin(deltaLambda) * Math.cos(phi2);
      const x = Math.cos(phi1) * Math.sin(phi2) -
                Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);

      let theta = Math.atan2(y, x);
      return (theta * 180 / Math.PI + 360) % 360;
    }

    function latLngToAFramePos(latLng) {
      const containerPoint = map.latLngToContainerPoint(latLng);
      const mapSize = map.getSize();
      const x = containerPoint.x - (mapSize.x / 2);
      const y = (mapSize.y / 2) - containerPoint.y;
      return { x, y, z: 0 };
    }

    function syncCamera() {
      const camera = document.getElementById('aframe-camera');
      const size = map.getSize();
      if (camera && camera.components.camera) {
        const cam = camera.components.camera.camera;
        cam.left = -size.x / 2;
        cam.right = size.x / 2;
        cam.top = size.y / 2;
        cam.bottom = -size.y / 2;
        cam.updateProjectionMatrix();
      }
    }

    map.on('resize', syncCamera);
    window.addEventListener('load', syncCamera);

    async function startNavigationAnimation() {
      if (isAnimating) return;

      const startStr = `${hsingWuCoord[1]},${hsingWuCoord[0]}`;
      const endStr = `${linkouBusCoord[1]},${linkouBusCoord[0]}`;
      const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${startStr};${endStr}?overview=full&geometries=geojson`;

      try {
        const response = await fetch(osrmUrl);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const rawCoords = data.routes[0].geometry.coordinates;
          const latLngPath = rawCoords.map(c => L.latLng(c[1], c[0]));

          if (routePolyline) map.removeLayer(routePolyline);
          routePolyline = L.polyline(latLngPath, { color: '#38BDF8', weight: 8, opacity: 0.9 }).addTo(map);

          syncCamera();
          runCarAnimation(latLngPath, 10000);
        }
      } catch (err) {
        console.error('導航動畫執行失敗:', err);
      }
    }

    function runCarAnimation(latLngPath, totalDurationMs) {
      const car = document.getElementById('nav-car');
      const mapWrapper = document.getElementById('map-wrapper');
      car.setAttribute('visible', 'true');
      isAnimating = true;

      let totalDistance = 0;
      const distances = [];
      for (let i = 0; i < latLngPath.length - 1; i++) {
        const dist = latLngPath[i].distanceTo(latLngPath[i + 1]);
        distances.push(dist);
        totalDistance += dist;
      }

      const startTime = performance.now();

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        let progress = elapsed / totalDurationMs;
        if (progress > 1) progress = 1;

        const currentTargetDist = progress * totalDistance;
        let accumulatedDist = 0;
        let currentLatLng = latLngPath[0];
        let nextLatLng = latLngPath[1];

        for (let i = 0; i < distances.length; i++) {
          if (accumulatedDist + distances[i] >= currentTargetDist) {
            const segmentProgress = (currentTargetDist - accumulatedDist) / distances[i];
            const p1 = latLngPath[i];
            const p2 = latLngPath[i + 1];

            const interpolatedLat = p1.lat + (p2.lat - p1.lat) * segmentProgress;
            const interpolatedLng = p1.lng + (p2.lng - p1.lng) * segmentProgress;
            currentLatLng = L.latLng(interpolatedLat, interpolatedLng);
            nextLatLng = p2;
            break;
          }
          accumulatedDist += distances[i];
        }

        map.panTo(currentLatLng, { animate: false });

        const bearing = calculateBearing(
          currentLatLng.lat, currentLatLng.lng,
          nextLatLng.lat, nextLatLng.lng
        );

        mapWrapper.style.transform = `rotateX(50deg) rotateZ(${-bearing}deg) scale(1.2)`;

        const pos = latLngToAFramePos(currentLatLng);
        // 將整個汽車與車燈 Parent Entity 一起平移
        car.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isAnimating = false;
        }
      }

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
