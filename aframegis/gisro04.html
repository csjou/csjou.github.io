<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSM + A-Frame 導航小球地圖跟隨動畫</title>

  <!-- 1. Leaflet.js 2D 地圖庫 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 2. A-Frame 3D 框架 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* 底層：Leaflet 地圖 */
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 上層：透明的 A-Frame 3D Canvas 蓋在地圖上方 */
    #aframe-overlay {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none; /* 讓滑鼠點擊穿透 */
    }

    /* UI 按鈕 */
    .nav-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      padding: 12px 24px;
      background-color: #E11D48;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .nav-btn:hover {
      background-color: #BE123C;
    }
  </style>
</head>
<body>

  <button class="nav-btn" onclick="startNavigationAnimation()">開啟地圖跟隨導航動畫</button>

  <!-- 2D 地圖底層 -->
  <div id="map"></div>

  <!-- 3D A-Frame 覆蓋層 -->
  <div id="aframe-overlay">
    <a-scene embedded vr-mode-ui="enabled: false" style="background: transparent;">
      <!-- 綠色 3D 小球 -->
      <a-sphere id="nav-sphere" color="#10B981" radius="15" visible="false"></a-sphere>
      <!-- 正交投影相機 -->
      <a-camera id="aframe-camera" orthographic position="0 0 1000" near="0.1" far="2000"></a-camera>
    </a-scene>
  </div>

  <script>
    // 1. 定義起終點 [緯度, 經度]
    const hsingWuCoord = [25.0792, 121.3965];   // 醒吾科技大學
    const linkouBusCoord = [25.0645, 121.3625];  // 林口轉運站

    // 2. 初始化 Leaflet 地圖 (放大級數設為 16 讓視野跟隨效果更明顯)
    const map = L.map('map').setView(hsingWuCoord, 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap 貢獻者'
    }).addTo(map);

    L.marker(hsingWuCoord).addTo(map).bindPopup('<b>起點：醒吾科技大學</b>');
    L.marker(linkouBusCoord).addTo(map).bindPopup('<b>終點：林口轉運站</b>');

    let routePolyline = null;
    let isAnimating = false;

    // 將地理座標 LatLng 轉換為 A-Frame 相對螢幕中心點座標
    function latLngToAFramePos(latLng) {
      const containerPoint = map.latLngToContainerPoint(latLng);
      const mapSize = map.getSize();
      const x = containerPoint.x - (mapSize.x / 2);
      const y = (mapSize.y / 2) - containerPoint.y;
      return { x, y, z: 0 };
    }

    // 地圖縮放或視窗調整時校正 A-Frame 相機
    function syncCamera() {
      const camera = document.getElementById('aframe-camera');
      const size = map.getSize();
      if (camera && camera.components.camera) {
        const cam = camera.components.camera.camera;
        cam.left = -size.x / 2;
        cam.right = size.x / 2;
        cam.top = size.y / 2;
        cam.bottom = -size.y / 2;
        cam.updateProjectionMatrix();
      }
    }

    map.on('resize', syncCamera);
    window.addEventListener('load', syncCamera);

    // 3. 取得 OSRM 導航路線並準備動畫
    async function startNavigationAnimation() {
      if (isAnimating) return;

      const startStr = `${hsingWuCoord[1]},${hsingWuCoord[0]}`;
      const endStr = `${linkouBusCoord[1]},${linkouBusCoord[0]}`;
      const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${startStr};${endStr}?overview=full&geometries=geojson`;

      try {
        const response = await fetch(osrmUrl);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const rawCoords = data.routes[0].geometry.coordinates; // [Lon, Lat]
          const latLngPath = rawCoords.map(c => L.latLng(c[1], c[0]));

          // 繪製紅色導航路線
          if (routePolyline) map.removeLayer(routePolyline);
          routePolyline = L.polyline(latLngPath, {
            color: '#E11D48',
            weight: 7,
            opacity: 0.85
          }).addTo(map);

          syncCamera();

          // 啟動 10 秒動畫 (10000 毫秒)
          runSphereAnimation(latLngPath, 10000);
        }
      } catch (err) {
        console.error('路徑請求或動畫執行失敗:', err);
      }
    }

    // 4. 動畫迴圈：計算小球位置並自動帶動地圖跟隨
    function runSphereAnimation(latLngPath, totalDurationMs) {
      const sphere = document.getElementById('nav-sphere');
      sphere.setAttribute('visible', 'true');
      isAnimating = true;

      // 計算路線總距離
      let totalDistance = 0;
      const distances = [];
      for (let i = 0; i < latLngPath.length - 1; i++) {
        const dist = latLngPath[i].distanceTo(latLngPath[i + 1]);
        distances.push(dist);
        totalDistance += dist;
      }

      const startTime = performance.now();

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        let progress = elapsed / totalDurationMs;

        if (progress > 1) progress = 1;

        // 計算目前時間對應的內插經緯度座標
        const currentTargetDist = progress * totalDistance;
        let accumulatedDist = 0;
        let currentLatLng = latLngPath[0];

        for (let i = 0; i < distances.length; i++) {
          if (accumulatedDist + distances[i] >= currentTargetDist) {
            const segmentProgress = (currentTargetDist - accumulatedDist) / distances[i];
            const p1 = latLngPath[i];
            const p2 = latLngPath[i + 1];

            const interpolatedLat = p1.lat + (p2.lat - p1.lat) * segmentProgress;
            const interpolatedLng = p1.lng + (p2.lng - p1.lng) * segmentProgress;
            currentLatLng = L.latLng(interpolatedLat, interpolatedLng);
            break;
          }
          accumulatedDist += distances[i];
        }

        // 【關鍵處 1】：平移地圖視角，讓地圖中心始終鎖定在當前小球的經緯度 (關閉動畫補間以保持流暢)
        map.panTo(currentLatLng, { animate: false });

        // 【關鍵處 2】：更新 A-Frame 綠色小球的 3D 空間位置
        const pos = latLngToAFramePos(currentLatLng);
        sphere.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isAnimating = false;
        }
      }

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
