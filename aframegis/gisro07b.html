<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSM + A-Frame 3D 汽車自動縮放貼地導航</title>

  <!-- 1. Leaflet.js 地圖庫 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 2. A-Frame 3D 框架 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #09090b;
      perspective: 1000px;
      perspective-origin: 50% 65%;
    }

    #map-wrapper {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      transform-origin: 50% 50%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    #aframe-overlay {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    .nav-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      padding: 12px 24px;
      background-color: #E11D48;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    #status-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      padding: 8px 14px;
      background: rgba(15, 23, 42, 0.85);
      color: #38BDF8;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="status-badge">等待載入 3D 模型...</div>
  <button class="nav-btn" onclick="startNavigationAnimation()">開啟 3D 車輛導航</button>

  <!-- 2D 地圖容器 -->
  <div id="map-wrapper">
    <div id="map"></div>
  </div>

  <!-- 3D A-Frame 覆蓋層 -->
  <div id="aframe-overlay">
    <a-scene embedded vr-mode-ui="enabled: false" style="background: transparent;">
      <a-assets>
        <!-- 請確保同目錄下有 car.glb，或替換為有效的線上 GLB 網址 -->
        <a-asset-item id="car-asset" src="assets/car.glb"></a-asset-item>
      </a-assets>

      <!-- 外層控制整體在地圖上的位置與轉向 -->
      <a-entity id="nav-car-container" visible="false">
        <!-- 內層負責模型本體的「初始朝向翻正」、「3倍尺寸縮放」與「底部貼地校正」 -->
        <a-gltf-model id="car-model-mesh" src="#car-asset" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 環境光與平行光，避免 PBR 材質變黑 -->
      <a-light type="ambient" intensity="1.4"></a-light>
      <a-light type="directional" position="50 100 150" intensity="1.6"></a-light>

      <!-- 正交相機 -->
      <a-camera id="aframe-camera" orthographic position="0 0 1000" near="0.1" far="2000"></a-camera>
    </a-scene>
  </div>

  <script>
    const hsingWuCoord = [25.0792, 121.3965];   // 醒吾科技大學
    const linkouBusCoord = [25.0645, 121.3625];  // 林口轉運站

    const map = L.map('map', { zoomControl: false }).setView(hsingWuCoord, 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    L.marker(hsingWuCoord).addTo(map).bindPopup('<b>起點：醒吾科技大學</b>');
    L.marker(linkouBusCoord).addTo(map).bindPopup('<b>終點：林口轉運站</b>');

    let routePolyline = null;
    let isAnimating = false;

    // -------------------------------------------------------------
    // 關鍵步驟：監聽 car.glb 載入完成，讀取邊界尺寸並調整為小球 3 倍與貼地
    // -------------------------------------------------------------
    const carMeshEl = document.getElementById('car-model-mesh');
    const statusBadge = document.getElementById('status-badge');

    carMeshEl.addEventListener('model-loaded', (e) => {
      const mesh = e.detail.model;

      // 1. 先計算套用 rotation="90 0 0" 後的原始包圍盒尺寸
      carMeshEl.object3D.updateMatrixWorld(true);
      const rawBox = new THREE.Box3().setFromObject(carMeshEl.object3D);
      const rawSize = new THREE.Vector3();
      rawBox.getSize(rawSize);

      // 原先綠色小球 radius=15 (直徑 30)，目標 3 倍尺寸 = 90 單位
      const sphereDiameter = 30;
      const targetSize = sphereDiameter * 3;
      const maxDim = Math.max(rawSize.x, rawSize.y, rawSize.z);

      if (maxDim > 0) {
        const scaleRatio = targetSize / maxDim;
        carMeshEl.setAttribute('scale', `${scaleRatio} ${scaleRatio} ${scaleRatio}`);
      }

      // 2. 縮放完成後，重新計算世界座標包圍盒以校正中心與貼地高度
      carMeshEl.object3D.updateMatrixWorld(true);
      const scaledBox = new THREE.Box3().setFromObject(carMeshEl.object3D);
      const center = new THREE.Vector3();
      scaledBox.getCenter(center);

      // X、Y 軸中心點歸零對齊路線，Z 軸抬高 (-scaledBox.min.z) 讓車輪底部緊貼 Z=0 地面
      const offsetX = -center.x;
      const offsetY = -center.y;
      const offsetZ = -scaledBox.min.z;

      carMeshEl.setAttribute('position', `${offsetX} ${offsetY} ${offsetZ}`);

      statusBadge.innerText = `模型載入成功 (原始最大邊: ${maxDim.toFixed(2)} → 已縮放至 ${targetSize} 並貼地)`;
      statusBadge.style.color = '#10B981';
    });

    carMeshEl.addEventListener('model-error', (e) => {
      statusBadge.innerText = '錯誤：找不到 car.glb 檔案，請確認路徑';
      statusBadge.style.color = '#EF4444';
    });

    // 計算經緯度切線方位角
    function calculateBearing(lat1, lng1, lat2, lng2) {
      const rad = Math.PI / 180;
      const phi1 = lat1 * rad;
      const phi2 = lat2 * rad;
      const deltaLambda = (lng2 - lng1) * rad;

      const y = Math.sin(deltaLambda) * Math.cos(phi2);
      const x = Math.cos(phi1) * Math.sin(phi2) -
                Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);

      let theta = Math.atan2(y, x);
      return (theta * 180 / Math.PI + 360) % 360;
    }

    function latLngToAFramePos(latLng) {
      const containerPoint = map.latLngToContainerPoint(latLng);
      const mapSize = map.getSize();
      const x = containerPoint.x - (mapSize.x / 2);
      const y = (mapSize.y / 2) - containerPoint.y;
      return { x, y, z: 0 };
    }

    function syncCamera() {
      const camera = document.getElementById('aframe-camera');
      const size = map.getSize();
      if (camera && camera.components.camera) {
        const cam = camera.components.camera.camera;
        cam.left = -size.x / 2;
        cam.right = size.x / 2;
        cam.top = size.y / 2;
        cam.bottom = -size.y / 2;
        cam.updateProjectionMatrix();
      }
    }

    map.on('resize', syncCamera);
    window.addEventListener('load', syncCamera);

    async function startNavigationAnimation() {
      if (isAnimating) return;

      const startStr = `${hsingWuCoord[1]},${hsingWuCoord[0]}`;
      const endStr = `${linkouBusCoord[1]},${linkouBusCoord[0]}`;
      const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${startStr};${endStr}?overview=full&geometries=geojson`;

      try {
        const response = await fetch(osrmUrl);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const rawCoords = data.routes[0].geometry.coordinates;
          const latLngPath = rawCoords.map(c => L.latLng(c[1], c[0]));

          if (routePolyline) map.removeLayer(routePolyline);
          routePolyline = L.polyline(latLngPath, { color: '#E11D48', weight: 8, opacity: 0.9 }).addTo(map);

          syncCamera();
          runCarAnimation(latLngPath, 10000);
        }
      } catch (err) {
        console.error('導航動畫執行失敗:', err);
      }
    }

    function runCarAnimation(latLngPath, totalDurationMs) {
      const carContainer = document.getElementById('nav-car-container');
      const mapWrapper = document.getElementById('map-wrapper');
      carContainer.setAttribute('visible', 'true');
      isAnimating = true;

      let totalDistance = 0;
      const distances = [];
      for (let i = 0; i < latLngPath.length - 1; i++) {
        const dist = latLngPath[i].distanceTo(latLngPath[i + 1]);
        distances.push(dist);
        totalDistance += dist;
      }

      const startTime = performance.now();

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        let progress = elapsed / totalDurationMs;
        if (progress > 1) progress = 1;

        const currentTargetDist = progress * totalDistance;
        let accumulatedDist = 0;
        let currentLatLng = latLngPath[0];
        let nextLatLng = latLngPath[1];

        for (let i = 0; i < distances.length; i++) {
          if (accumulatedDist + distances[i] >= currentTargetDist) {
            const segmentProgress = (currentTargetDist - accumulatedDist) / distances[i];
            const p1 = latLngPath[i];
            const p2 = latLngPath[i + 1];

            const interpolatedLat = p1.lat + (p2.lat - p1.lat) * segmentProgress;
            const interpolatedLng = p1.lng + (p2.lng - p1.lng) * segmentProgress;
            currentLatLng = L.latLng(interpolatedLat, interpolatedLng);
            nextLatLng = p2;
            break;
          }
          accumulatedDist += distances[i];
        }

        // 1. 地圖跟隨中心
        map.panTo(currentLatLng, { animate: false });

        // 2. 計算方位角並旋轉底圖
        const bearing = calculateBearing(
          currentLatLng.lat, currentLatLng.lng,
          nextLatLng.lat, nextLatLng.lng
        );
        mapWrapper.style.transform = `rotateX(50deg) rotateZ(${-bearing}deg) scale(1.2)`;

        // 3. 更新外層容器位置 (車頭已隨地圖旋轉保持朝向上方)
        const pos = latLngToAFramePos(currentLatLng);
        carContainer.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isAnimating = false;
        }
      }

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
