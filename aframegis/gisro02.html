<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>程式 2：地圖加載道路導航路線</title>

  <!-- 引入 Leaflet.js CSS 與 JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    /* 導航按鈕樣式 */
    .nav-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      padding: 12px 24px;
      background-color: #E11D48;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .nav-btn:hover {
      background-color: #BE123C;
    }
  </style>
</head>
<body>

  <!-- 控制按鈕 -->
  <button class="nav-btn" onclick="drawRoute()">顯示導航路線</button>

  <div id="map"></div>

  <script>
    // 1. 定義座標 [緯度 Lat, 經度 Lon]
    const hsingWuCoord = [25.0792, 121.3965];  // 醒吾科技大學
    const linkouBusCoord = [25.0645, 121.3625]; // 林口轉運站

    // 2. 初始化 Leaflet 地圖
    const map = L.map('map').setView([25.0718, 121.3795], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap 貢獻者'
    }).addTo(map);

    // 3. 標註起終點
    L.marker(hsingWuCoord).addTo(map).bindPopup('<b>起點：醒吾科技大學</b>');
    L.marker(linkouBusCoord).addTo(map).bindPopup('<b>終點：林口轉運站</b>');

    let routePolyline = null; // 儲存路線物件

    // 4. 取得並繪製路線主程式
    async function drawRoute() {
      // 若路線已存在則不重複繪製
      if (routePolyline) return;

      // 注意：OSRM API 經緯度格式為 [Lon, Lat] (經度在前，緯度在後)
      const startStr = `${hsingWuCoord[1]},${hsingWuCoord[0]}`;
      const endStr = `${linkouBusCoord[1]},${linkouBusCoord[0]}`;
      
      // 使用 OSRM 駕車路線 API (overview=full & geometries=geojson 取得完整點陣列)
      const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${startStr};${endStr}?overview=full&geometries=geojson`;

      try {
        const response = await fetch(osrmUrl);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          // OSRM 回傳格式為 [Lon, Lat]，轉換為 Leaflet 需要的 [Lat, Lon]
          const coordinates = data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);

          // 繪製紅色略粗曲線 (weight: 7 代表粗細，opacity: 0.8 透明度)
          routePolyline = L.polyline(coordinates, {
            color: '#E11D48',
            weight: 7,
            opacity: 0.85,
            smoothFactor: 1
          }).addTo(map);

          // 自動調整地圖視角以涵蓋整條路線
          map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });
        } else {
          alert('無法計算導航路線');
        }
      } catch (error) {
        console.error('路徑請求失敗:', error);
        alert('取得路徑時發生錯誤，請檢查網路狀態');
      }
    }
  </script>

</body>
</html>
