<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unit11 Example 01</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.rawgit.com/donmccurdy/aframe-physics-system/v3.3.0/dist/aframe-physics-system.min.js"></script>
</head>
<body>
<a-scene physics="gravity: -9.8">
  <a-box position="0 4 -3" dynamic-body color="red"></a-box>
  <a-plane rotation="-90 0 0" width="10" height="10" static-body color="#7BC8A4"></a-plane>
  <a-sky color="#ECECEC"></a-sky>
</a-scene>
</body>
</html>
