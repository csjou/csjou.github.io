<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>092012 A-Frame Layout 排列範例</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-layout-component@5.3.0/dist/aframe-layout-component.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #222">
      <a-assets>
        <a-assets>
            <script id="boxTemplate" type="text/html">
                <a-box color="#4CC3D9" width="0.5" height="0.5" depth="0.5"></a-box>
            </script>
        </a-assets>
      </a-assets>

      <a-entity layout="type: line; margin: 1.5" position="-3 0 -5">
        
        <a-box color="yellow" scale="0.5 0.5 0.5"></a-entity>
        <a-box color="yellow" scale="0.5 0.5 0.5"></a-entity>
        <a-box color="yellow" scale="0.5 0.5 0.5"></a-entity>
        <a-box color="yellow" scale="0.5 0.5 0.5"></a-entity>
        <a-box color="yellow" scale="0.5 0.5 0.5"></a-entity>

      </a-entity>

      <a-light type="ambient" intensity="0.8"></a-light>
      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </body>
</html>
