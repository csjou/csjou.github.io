<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>周重石 wk1406 抓pokemon</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>

<body>
    <a-scene vr-mode-ui="enabled: false"
             arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">
        <a-obj-model src="ivy.obj" mtl="ivy.mtl"
                     look-at="[gps-camera]"
                     scale="2 2 2"
                     gps-entity-place="latitude: 25.08135; longitude:121.39674;">
        </a-obj-model>
        <a-obj-model src="ha.obj" mtl="ha.mtl"
                     look-at="[gps-camera]"
                     scale="2 2 2"
                     gps-entity-place="latitude: 25.08090; longitude: 121.39667;">
        </a-obj-model>
        <a-obj-model src="ceon.obj" mtl="ceon.mtl"
                     look-at="[gps-camera]"
                     scale="2 2 2"
                     gps-entity-place="latitude: 25.08135; longitude: 121.39599;">
        </a-obj-model>
        <a-obj-model src="cder.obj" mtl="cder.mtl"
                     look-at="[gps-camera]"
                     scale="2 2 2"
                     gps-entity-place="latitude: 25.08151; longitude: 121.39476;">
        </a-obj-model>
        <a-obj-model src="bulb.obj" mtl="bulb.mtl"
                     look-at="[gps-camera]"
                     scale="2 2 2"
                     gps-entity-place="latitude: 25.08100; longitude: 121.39415;">
        </a-obj-model>
        <a-obj-model src="ivy.obj" mtl="ivy.mtl"
        look-at="[gps-camera]"
        scale="2 2 2"
        gps-entity-place="latitude: 25.08111350639258; longitude: 121.39689304615467;">
    </a-obj-model>
        <a-camera gps-camera rotation-reader> </a-camera>
    </a-scene>
</body>
</html>
