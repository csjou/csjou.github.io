<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>教室 Location-Based AR 抓寶</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
    <style>
        /* HUD 計分板與資訊顯示 */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none; /* 讓點擊事件穿透 */
        }
        #hud h2 {
            margin: 0 0 5px 0;
            color: #4df3a9;
            font-size: 16px;
        }
        /* 準星 (Gaze Cursor) 的視覺提示 */
        .reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border: 2px solid white;
            border-radius: 50%;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="hud">
        <h2>AR 寶可夢訓練家</h2>
        <div>學號末四碼: <span id="student-id">2012</span></div> <div>目前得分: <span id="score">0</span> 分</div>
        <hr style="border-color: #555;">
        <div style="font-size: 11px; color: #ccc;">
            補獲時經度: <span id="capture-lng">-</span><br>
            補獲時緯度: <span id="capture-lat">-</span>
        </div>
    </div>

    <div class="reticle"></div>

    <a-scene 
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-assets>
            <a-asset-item id="pokemon1-obj" src="bulb.obj"></a-asset-item>
            <a-asset-item id="pokemon1-mtl" src="bulb.mtl"></a-asset-item>
            
            <a-asset-item id="pokemon2-obj" src="cder.obj"></a-asset-item>
            <a-asset-item id="pokemon2-mtl" src="cder.mtl"></a-asset-item>
            
            <a-asset-item id="pokemon3-obj" src="ceon.obj"></a-asset-item>
            <a-asset-item id="pokemon3-mtl" src="ceon.mtl"></a-asset-item>
            
            <a-asset-item id="pokemon4-obj" src="ha.obj"></a-asset-item>
            <a-asset-item id="pokemon4-mtl" src="ha.mtl"></a-asset-item>
        </a-assets>

        <a-camera gps-camera rotation-reader>
            <a-cursor 
                id="fuse-cursor"
                fuse="true" 
                fuse-timeout="1000"
                raycaster="objects: .catchable"
                geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                material="color: #4df3a9; shader: flat"
                position="0 0 -1"
                animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1000; from: 1 1 1; to: 0.1 0.1 0.1"
                animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 200; to: 1 1 1">
            </a-cursor>
        </a-camera>

        <a-entity id="pokemon-group"></a-entity>

    </a-scene>

    <script>
        // 1. 基礎參數設定
        const CENTER_LAT = 25.081062; // 教室基準緯度
        const CENTER_LNG = 121.396904; // 教室基準經度
        let score = 0;

        // 地球半徑與經緯度轉換常數 (用於計算 5 公尺的經緯度偏移量)
        const METER_TO_LAT = 1 / 111111; 
        const METER_TO_LNG = 1 / (111111 * Math.cos(CENTER_LAT * Math.PI / 180));
        const DISTANCE = 5; // 距離 5 公尺

        // 2. 定義 8 個方位的偏移係數 (Δx, Δy) 與對應的 4 種模型
        // 1 代表往正/東，-1 代表往負/西，0.707 為 45 度角的三角函數值 (sin45°/cos45°)
        const directions = [
            { name: "前 (北)", latMod: 1, lngMod: 0, model: "#pokemon1-obj", mtl: "#pokemon1-mtl" },
            { name: "後 (南)", latMod: -1, lngMod: 0, model: "#pokemon1-obj", mtl: "#pokemon1-mtl" },
            { name: "右 (東)", latMod: 0, lngMod: 1, model: "#pokemon2-obj", mtl: "#pokemon2-mtl" },
            { name: "左 (西)", latMod: 0, lngMod: -1, model: "#pokemon2-obj", mtl: "#pokemon2-mtl" },
            { name: "右前 (東北)", latMod: 0.707, lngMod: 0.707, model: "#pokemon3-obj", mtl: "#pokemon3-mtl" },
            { name: "左前 (西北)", latMod: 0.707, lngMod: -0.707, model: "#pokemon3-obj", mtl: "#pokemon3-mtl" },
            { name: "右後 (東南)", latMod: -0.707, lngMod: 0.707, model: "#pokemon4-obj", mtl: "#pokemon4-mtl" },
            { name: "左後 (西南)", latMod: -0.707, lngMod: -0.707, model: "#pokemon4-obj", mtl: "#pokemon4-mtl" }
        ];

        // 3. 批量生成寶可夢實體
        const sceneGroup = document.getElementById('pokemon-group');

        directions.forEach((dir, index) => {
            // 計算該方位距離 5 公尺後的實際經緯度
            const targetLat = CENTER_LAT + (dir.latMod * DISTANCE * METER_TO_LAT);
            const targetLng = CENTER_LNG + (dir.lngMod * DISTANCE * METER_TO_LNG);

            // 建立 A-Frame 實體
            const pokemon = document.createElement('a-entity');
            
            // 賦予 location-based 屬性與模型資產
            pokemon.setAttribute('gps-entity-place', `latitude: ${targetLat}; longitude: ${targetLng};`);
            pokemon.setAttribute('obj-model', `obj: ${dir.model}; mtl: ${dir.mtl}`);
            pokemon.setAttribute('class', 'catchable'); // 讓 raycaster 能夠偵測
            pokemon.setAttribute('scale', '1 1 1');   // 根據模型大小調整初始縮放
            
            // 監聽 Gaze 凝視成功事件 (click 會在 fuse-timeout 到期時由 cursor 觸發)
            pokemon.addEventListener('click', function () {
                capturePokemon(pokemon);
            });

            sceneGroup.appendChild(pokemon);
        });

        // 4. 捕捉機制與動畫特效
        function capturePokemon(element) {
            // 避免重複點擊/凝視
            if (element.classList.contains('captured')) return;
            element.classList.remove('catchable');
            element.classList.add('captured');

            // 取得觸發當下手機的即時 GPS 座標
            navigator.geolocation.getCurrentPosition((position) => {
                document.getElementById('capture-lat').innerText = position.coords.latitude.toFixed(6);
                document.getElementById('capture-lng').innerText = position.coords.longitude.toFixed(6);
            }, (err) => {
                // 若隱私權限阻止或無法取得，則顯示基準點作為示意
                document.getElementById('capture-lat').innerText = CENTER_LAT.toFixed(6) + " (基底)";
                document.getElementById('capture-lng').innerText = CENTER_LNG.toFixed(6) + " (基底)";
            }, { enableHighAccuracy: true });

            // 更新計分板
            score += 10;
            document.getElementById('score').innerText = score;

            // 建立特效：閃光 (Flash) 與 縮放消失動畫
            // 閃光特效：短時間內改為純白發光物質
            element.setAttribute('material', 'shader: flat; color: #ffffff; emissive: #ffffff');
            
            // 縮放與旋轉消失動畫 (透過 A-Frame animation 屬性)
            element.setAttribute('animation__shrink', {
                property: 'scale',
                to: '0 0 0',
                dur: 800,
                easing: 'easeInBack'
            });
            element.setAttribute('animation__spin', {
                property: 'rotation',
                to: '0 360 0',
                dur: 800,
                easing: 'linear'
            });

            // 動畫結束後移除物件
            setTimeout(() => {
                element.parentNode.removeChild(element);
            }, 850);
        }
    </script>
</body>
</html>
