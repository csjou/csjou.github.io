<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame 7 彩 Box 範例</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-layout-component@5.3.0/dist/aframe-layout-component.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #ECECEC">
      
      <a-entity layout="type: line; margin: 1.5" rotation="0 90 0" position="-4.5 1.5 -4">
        
        <a-box color="#FF0000" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-box>
        <a-box color="#FF7F00"></a-box>
        <a-box color="#FFFF00"></a-box>
        <a-box color="#00FF00"></a-box>
        <a-box color="#0000FF"></a-box>
        <a-box color="#4B0082"></a-box>
        <a-box color="#8B00FF"></a-box>
        
      </a-entity>

      <a-light type="ambient" color="#BBB"></a-light>
      <a-light type="directional" color="#FFF" intensity="0.6" position="-1 1 1"></a-light>
    </a-scene>
  </body>
</html>
