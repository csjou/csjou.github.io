<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unit03 Example 01</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('click-change', {
      init: function () {
        this.el.addEventListener('click', () => {
          this.el.setAttribute('color', 'yellow');
        });
      }
    });
  </script>
</head>
<body>
<a-scene>
  <a-box position="0 1 -3" color="red" click-change></a-box>
  <a-camera>
    <a-cursor></a-cursor>
  </a-camera>
</a-scene>
</body>
</html>
