<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周重石 wk1306 AR.js 相機測試</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://ar-js-org.github.io/AR.js/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    // 範例：A-Frame 寫法
    <a-scene embedded arjs="detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        <a-assets>
            <a-asset-item id="fox" src="fox.glb"></a-asset-item>
        </a-assets>
        <a-marker type='pattern' url='pattern-marker.patt'>
            <a-box position="0 0.5 0" material="color: yellow; opacity: 0.8;"></a-box>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
