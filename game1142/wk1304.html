<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周重石 wk1304 AR.js 相機測試</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://ar-js-org.github.io/AR.js/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <a-scene embedded arjs="sourceType: webcam; debugPanelEnabled: false;" vr-mode-ui="enabled: false">
        <a-assets>
            <a-asset-item id="fox" src="fox.glb"></a-asset-item>
        </a-assets>

        <!--<a-gltf-model src="#fox" scale="0.01 0.01 0.01" rotation="-45 45 0" position="-3 1 -5"></a-gltf-model>-->
        <a-box scale="0.2 0.2 0.2"
               position="0 0 -3"
               rotation="45 45 0"
               animation="property: rotation.y; to: 360; dur: 3000; easing: linear; loop: true"
               material="color: #4CC3D9; opacity: 0.9;">
        </a-box>

        <a-sphere position="1.5 0 -3" radius="0.5" color="#EF2D5E"></a-sphere>

        <a-entity camera>
            <a-gltf-model src="#fox"
                          scale="0.01 0.01 0.01"
                          rotation="0 180 0"
                          position="0.5 -0.5 -1">
            </a-gltf-model>
        </a-entity>

    </a-scene>

</body>
</html>
