<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Space Gaze Shooter Pro</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>

    <style>
        #ui {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 10px #00FF00;
        }

        .stat {
            display: inline-block;
            margin: 0 20px;
            font-size: 28px;
            font-weight: bold;
        }

        #game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 0, 0.9);
            color: #00FF00;
            padding: 40px;
            border: 2px solid #00FF00;
            border-radius: 20px;
            z-index: 200;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            background: #00FF00;
            color: black;
            border: none;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat">SCORE: <span id="score">0</span></div>
        <div class="stat">TIME: <span id="timer">60</span>s</div>
        <div id="game-over">
            <h1>GAME OVER</h1>
            <p>DESTRUCTED TARGETS: <span id="final-score">0</span></p>
            <button onclick="location.reload()">RE-DEPLOY</button>
        </div>
    </div>

    <script>
      let score = 0;
      let timeLeft = 60;
      let gameActive = true;

      // 飛船移動組件
      AFRAME.registerComponent('spaceship', {
        init: function () {
          this.direction = new THREE.Vector3(0, 1.6, 0);
          this.speed = 0.08 + Math.random() * 0.15; // 稍微提升速度感
          // 給飛船一個隨機自轉
          this.rotationSpeed = {
            x: Math.random() * 2,
            y: Math.random() * 2,
            z: Math.random() * 2
          };
        },
        tick: function (time, timeDelta) {
          if (!gameActive) return;

          let currentPos = this.el.object3D.position;
          let targetPos = new THREE.Vector3(0, 1.6, 0);

          // 向玩家移動
          let dir = new THREE.Vector3().subVectors(targetPos, currentPos).normalize();
          currentPos.addScaledVector(dir, this.speed);

          // 自轉效果
          this.el.object3D.rotation.x += 0.01;
          this.el.object3D.rotation.y += 0.01;

          if (currentPos.distanceTo(targetPos) < 1.2) {
            if(this.el.parentNode) this.el.parentNode.removeChild(this.el);
          }
        }
      });

      // 擊毀組件
      AFRAME.registerComponent('targetable', {
        init: function () {
          this.el.addEventListener('click', () => {
            if (!gameActive) return;
            score += 10;
            document.querySelector("#score").innerText = score;

            // 爆炸縮小特效
            this.el.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 150; easing: easeInBack');
            setTimeout(() => {
              if(this.el.parentNode) this.el.parentNode.removeChild(this.el);
            }, 150);
          });
        }
      });
    </script>

    <a-scene>
        <a-entity environment="preset: starry; ground: none; fog: 0;"></a-entity>

        <a-entity camera look-controls position="0 1.6 0">

            <a-entity geometry="primitive: circle; radius: 0.005"
                      material="color: #00FF00; shader: flat; opacity: 0.5"
                      position="0 0 -1">
            </a-entity>

            <a-entity cursor="fuse: true; fuseTimeout: 400"
                      position="0 0 -1.01"
                      geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                      material="color: #00FF00; shader: flat; depthTest: false"
                      animation__fusing="property: scale; startEvents: fusing; from: 1 1 1; to: 0.5 0.5 0.5; dur: 400"
                      animation__reset="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 100">
            </a-entity>

        </a-entity>

        <a-entity id="fleet"></a-entity>
    </a-scene>

    <script>
      const fleet = document.querySelector("#fleet");
      const primitives = ["a-box", "a-cone", "a-dodecahedron", "a-octahedron"];

      function spawnShip() {
        if (!gameActive) return;

        // 一次生成 1~2 艘增加量級
        const count = Math.random() > 0.7 ? 2 : 1;

        for(let i=0; i<count; i++) {
          const ship = document.createElement(primitives[Math.floor(Math.random() * primitives.length)]);

          // 隨機生成位置 (半徑 25m)
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * Math.PI;
          const radius = 25;
          const x = radius * Math.sin(phi) * Math.cos(theta);
          const y = radius * Math.sin(phi) * Math.sin(theta) + 1.6;
          const z = radius * Math.cos(phi);

          // 顏色邏輯：使用高飽和度與高亮度的 HSL，並開啟 emissive 自發光
          const hue = Math.floor(Math.random() * 360);
          const colorStr = `hsl(${hue}, 100%, 70%)`;

          ship.setAttribute('position', `${x} ${y} ${z}`);
          // 關鍵：material 增加 emissive 和 emissiveIntensity 讓它亮起來
          ship.setAttribute('material', `color: ${colorStr}; emissive: ${colorStr}; emissiveIntensity: 0.8; metalness: 0.5; roughness: 0.2`);
          ship.setAttribute('spaceship', '');
          ship.setAttribute('targetable', '');
          ship.setAttribute('scale', '1.2 1.2 1.2'); // 放大體積

          fleet.appendChild(ship);
        }
      }

      // 1. 大幅增加生成頻率：每 600 毫秒生成一次
      const spawnInterval = setInterval(spawnShip, 600);

      const timerInterval = setInterval(() => {
        timeLeft--;
        document.querySelector("#timer").innerText = timeLeft;
        if (timeLeft <= 0) {
          gameActive = false;
          clearInterval(spawnInterval);
          clearInterval(timerInterval);
          document.querySelector("#game-over").style.display = "block";
          document.querySelector("#final-score").innerText = score;
        }
      }, 1000);
    </script>
</body>
</html>
