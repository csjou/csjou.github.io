<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unit04 Example 01</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('target', {
      init: function () {
        this.el.addEventListener('click', () => {
          this.el.setAttribute('visible', false);
          alert('Hit!');
        });
      }
    });
  </script>
</head>
<body>
<a-scene>
  <a-sphere position="0 1 -4" radius="0.5" color="green" target></a-sphere>
  <a-camera>
    <a-cursor></a-cursor>
  </a-camera>
</a-scene>
</body>
</html>
