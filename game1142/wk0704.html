<!DOCTYPE html>
<html>

<head>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>

<body>
  <a-scene shadow="type: pcfsoft">
    <a-entity camera look-controls position="0 1.6 0">
      <a-cursor color="#FF0000"></a-cursor>
    </a-entity>
    <a-entity light="type: ambient; color: #444"></a-entity>
    <a-entity id="plight" light="type: point; intensity: 1; distance: 10" position="-1 2 1"></a-entity>

    <a-box id="myBox" position="0 0.5 -3" color="#4CC3D9" shadow="cast: true; receive: true"></a-box>

    <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4" shadow="receive: true"></a-plane>

    <a-sky color="#ECECEC"></a-sky>
  </a-scene>
  <script>
    // 取得物件節點
    const boxEl = document.querySelector('#myBox');
    const pLight = document.querySelector('#plight');
    // 設定材質陣列
    const textures = ['#img1', '#img2', '#img3'];
    let dist = 10;
    // 監聽 'click' 事件


    //boxE1.addEventListener('click', () => {
    //  index = (index + 1) % textures.length; // 循環索引
    //  boxEl.setAttribute('src', textures[index]);
    //});
    // 監聽 'click' 事件
    boxEl.addEventListener('click', () => {
      dist = dist + 10; // 持續增加
      //pLight.setAttribute('distance', dist);
      pLight.setAttribute('light', {
        distance: dist
      });
      console.log('燈光照射距離：' + dist);
    });
  </script>
</body>

</html>
