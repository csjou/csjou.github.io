<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unit10 Example 01</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('move-left-right', {
      init: function () {
        let direction = 1;
        setInterval(()=>{
          let pos = this.el.getAttribute('position');
          if(pos.x > 3 || pos.x < -3) direction*=-1;
          this.el.setAttribute('position',{x:pos.x+0.05*direction, y:pos.y, z:pos.z});
        },16);
      }
    });
  </script>
</head>
<body>
<a-scene>
  <a-box position="0 0.5 -3" color="red" move-left-right></a-box>
  <a-plane rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
  <a-entity camera position="0 1.6 0"></a-entity>
</a-scene>
</body>
</html>
