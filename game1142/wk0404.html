<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame 3x3x3 立方體陣列</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-layout-component@5.3.0/dist/aframe-layout-component.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #222">
      
      <a-entity position="-1.5 0.5 -6">
        
        <a-entity layout="type: grid; columns: 3; rows: 3; margin: 1.5; plane: xz" position="0 0 0">
          <a-box color="#FF0000"></a-box><a-box color="#FF0000"></a-box><a-box color="#FF0000"></a-box>
          <a-box color="#FF0000"></a-box><a-box color="#FF0000"></a-box><a-box color="#FF0000"></a-box>
          <a-box color="#FF0000"></a-box><a-box color="#FF0000"></a-box><a-box color="#FF0000"></a-box>
        </a-entity>

       

      </a-entity>

      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 1.6 2"></a-camera>
    </a-scene>
  </body>
</html>
