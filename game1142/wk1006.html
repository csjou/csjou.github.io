<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Space Gaze Shooter VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>

    <style>
        #ui {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            pointer-events: none; /* 讓 UI 不會阻擋點擊 */
            text-shadow: 2px 2px 4px #000;
        }

        .stat {
            display: inline-block;
            margin: 0 20px;
            font-size: 24px;
        }

        #game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            z-index: 200;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat">SCORE: <span id="score">0</span></div>
        <div class="stat">TIME: <span id="timer">60</span>s</div>
        <div id="game-over">
            <h1>MISSION COMPLETE</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button onclick="location.reload()" style="pointer-events: auto;">RESTART</button>
        </div>
    </div>

    <script>
      // 全域變數
      let score = 0;
      let timeLeft = 60;
      let gameActive = true;

      // 1. 註冊太空船移動元件
      AFRAME.registerComponent('spaceship', {
        init: function () {
          this.direction = new THREE.Vector3(0, 1.6, 0); // 目標是玩家頭部
          this.speed = 0.05 + Math.random() * 0.1; // 隨機速度
        },
        tick: function () {
          if (!gameActive) return;

          // 取得目前位置
          let currentPos = this.el.object3D.position;
          let targetPos = new THREE.Vector3(0, 1.6, 0);

          // 計算朝向玩家的方向
          let dir = new THREE.Vector3().subVectors(targetPos, currentPos).normalize();
          currentPos.addScaledVector(dir, this.speed);

          // 距離偵測：小於 1.5m 消失
          if (currentPos.distanceTo(targetPos) < 1.5) {
            this.el.parentNode.removeChild(this.el);
          }
        }
      });

      // 2. 擊毀邏輯元件
      AFRAME.registerComponent('targetable', {
        init: function () {
          this.el.addEventListener('click', () => {
            if (!gameActive) return;
            score += 10;
            document.querySelector("#score").innerText = score;

            // 播放消失動畫後刪除
            this.el.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 200');
            setTimeout(() => {
              if(this.el.parentNode) this.el.parentNode.removeChild(this.el);
            }, 200);
          });
        }
      });
    </script>

    <a-scene>
        <a-entity environment="preset: starry; seed: 1; ground: none;"></a-entity>

        <a-entity camera look-controls position="0 1.6 0">
            <a-entity cursor="fuse: true; fuseTimeout: 500"
                      position="0 0 -1"
                      geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                      material="color: #00FF00; shader: flat"
                      animation__fusing="property: scale; startEvents: fusing; from: 1 1 1; to: 0.1 0.1 0.1; dur: 500"
                      animation__reset="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 100">
            </a-entity>
        </a-entity>

        <a-entity id="fleet"></a-entity>
    </a-scene>

    <script>
      const fleet = document.querySelector("#fleet");
      const primitives = ["a-box", "a-cone", "a-dodecahedron"];

      // 每 1.5 秒生成一艘太空船
      function spawnShip() {
        if (!gameActive) return;

        const ship = document.createElement(primitives[Math.floor(Math.random() * primitives.length)]);

        // 隨機在 20m 外的圓球面上產生位置
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const radius = 20;

        const x = radius * Math.sin(phi) * Math.cos(theta);
        const y = radius * Math.sin(phi) * Math.sin(theta) + 1.6;
        const z = radius * Math.cos(phi);

        ship.setAttribute('position', `${x} ${y} ${z}`);
        ship.setAttribute('color', `hsl(${Math.random() * 360}, 70%, 60%)`);
        ship.setAttribute('spaceship', '');
        ship.setAttribute('targetable', '');
        ship.setAttribute('scale', '0.8 0.8 0.8');

        fleet.appendChild(ship);
      }

      const spawnInterval = setInterval(spawnShip, 1500);

      // 遊戲計時器
      const timerInterval = setInterval(() => {
        timeLeft--;
        document.querySelector("#timer").innerText = timeLeft;
        if (timeLeft <= 0) {
          gameActive = false;
          clearInterval(spawnInterval);
          clearInterval(timerInterval);
          document.querySelector("#game-over").style.display = "block";
          document.querySelector("#final-score").innerText = score;
        }
      }, 1000);
    </script>
</body>
</html>
