<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unit16 Example 01</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
<a-scene>
  <a-box id="player" position="0 0.5 -3" color="red"></a-box>
  <a-sphere position="1 1 -4" color="blue" class="target"></a-sphere>
  <a-plane rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
  <a-camera>
    <a-cursor></a-cursor>
  </a-camera>
  <script>
    document.querySelectorAll('.target').forEach(el=>{
      el.addEventListener('click', ()=>{
        el.setAttribute('visible', false);
        alert('You hit the target!');
      });
    });
  </script>
</a-scene>
</body>
</html>
