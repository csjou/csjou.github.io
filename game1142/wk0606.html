<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame Video Fix</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <div style="position: fixed; top: 10px; left: 10px; z-index: 999; color: white; background: rgba(0,0,0,0.5); padding: 10px;">
      請點擊畫面開始播放影片
    </div>

    <a-scene>
      <a-assets>
        <video id="myvideo" 
               src="mov_bbb.mp4" 
               autoplay loop="true" 
               crossorigin="anonymous" 
               playsinline webkit-playsinline>
        </video>
        
        </a-assets>

      <a-video src="#myvideo" width="4" height="2.25" position="0 1.6 -3"></a-video>

      <a-sky color="#222"></a-sky>
    </a-scene>

    <script>
      // 這是啟動影片的關鍵：監聽點擊事件
      document.querySelector('body').addEventListener('click', function () {
        var v = document.querySelector('#myvideo');
        v.play();
      });
    </script>
  </body>
</html>
