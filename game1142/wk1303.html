<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周重石 wk1302 AR.js 相機測試</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://ar-js-org.github.io/AR.js/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <a-scene embedded arjs="sourceType: webcam; debugPanelEnabled: false;" vr-mode-ui="enabled: false">
        <a-assets>
            <a-asset-item id="fox" src="fox.glb"></a-asset-item>
        </a-assets>
        <a-marker preset="hiro">
            <a-gltf-model src="#fox" scale="0.01 0.01 0.01" rotation="-45 45 0" position="0 0.5 0"></a-gltf-model>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
