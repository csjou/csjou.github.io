<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>浮動與非浮動資訊窗比較</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden; background-color: #f4f4f9;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-entity position="0 1.5 -3">
            <a-plane width="1" height="0.5" color="#222"></a-plane>
            <a-text value="Fixed Space\n(Turn to look away)" align="center" width="3" position="0 0 0.01"></a-text>
        </a-entity>


        <a-entity camera look-controls>

            <a-entity position="0 -0.8 -2">
                <a-plane width="1" height="0.5" color="#222" opacity="0.8"></a-plane>
                <a-text value="Floating UI\n(Always follows you)" align="center" width="3" position="0 0 0.01"></a-text>
            </a-entity>

        </a-entity>

    </a-scene>
</body>
</html>
