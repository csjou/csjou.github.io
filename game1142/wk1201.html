<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>周重石 wk1201 A-Frame 踏步火柴人</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
    <a-scene background="color: #ECECEC">

        <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
        <a-sky color="#ACE"></a-sky>

        <a-entity id="stickman" rotation="0 45 0" position="0 0 -5">

            <a-cylinder position="0 1 0" radius="0.05" height="0.8" color="#333"></a-cylinder>

            <a-entity id="neck-joint" position="0 1.4 0"
                      animation="property: rotation; from: -5 0 -5; to: 5 0 5; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine">
                <a-sphere position="0 0.2 0" radius="0.15" color="#333"></a-sphere>
            </a-entity>

            <a-entity id="right-arm-joint" position="0.1 1.3 0"
                      animation="property: rotation; from: -40 0 0; to: 40 0 0; dir: alternate; dur: 600; loop: true; easing: easeInOutQuad">
                <a-cylinder position="0 -0.3 0" radius="0.03" height="0.6" color="#333"></a-cylinder>
            </a-entity>

            <a-entity id="left-arm-joint" position="-0.1 1.3 0"
                      animation="property: rotation; from: 40 0 0; to: -40 0 0; dir: alternate; dur: 600; loop: true; easing: easeInOutQuad">
                <a-cylinder position="0 -0.3 0" radius="0.03" height="0.6" color="#333"></a-cylinder>
            </a-entity>

            <a-entity id="right-leg-joint" position="0.1 0.6 0"
                      animation="property: rotation; from: 30 0 0; to: -30 0 0; dir: alternate; dur: 600; loop: true; easing: easeInOutQuad">
                <a-cylinder position="0 -0.3 0" radius="0.04" height="0.7" color="#333"></a-cylinder>
            </a-entity>

            <a-entity id="left-leg-joint" position="-0.1 0.6 0"
                      animation="property: rotation; from: -30 0 0; to: 30 0 0; dir: alternate; dur: 600; loop: true; easing: easeInOutQuad">
                <a-cylinder position="0 -0.3 0" radius="0.04" height="0.7" color="#333"></a-cylinder>
            </a-entity>

            <a-animation property="position" from="0 0 -3" to="0 0.05 -3" dir="alternate" dur="300" loop="true"></a-animation>
        </a-entity>

        <a-entity position="0 1.6 0">
            <a-camera></a-camera>
        </a-entity>

    </a-scene>
</body>
</html>
