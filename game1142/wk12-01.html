<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unit12 Example 01</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
<a-scene>
  <a-box position="0 1 -4" color="red" id="target"></a-box>
  <a-camera>
    <a-cursor></a-cursor>
  </a-camera>
  <script>
    document.querySelector('#target').addEventListener('click', () => {
      alert('You hit the target!');
      document.querySelector('#target').setAttribute('visible', false);
    });
  </script>
</a-scene>
</body>
</html>
