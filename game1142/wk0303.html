<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>092012 A-Frame 3D 模型測試</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene background="color: #87CEEB">
        <a-assets>
            <a-asset-item id="duckModel" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb"></a-asset-item>
        </a-assets>
        <a-text value="092012" align="center" color="darkblue" scale="3 3 3" position="0 1.8 -10"></a-text>
        <a-entity gltf-model="#duckModel" 
                  position="0 0 -2" 
                  scale="1 1 1"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        </a-entity>

        <a-light type="ambient" intensity="0.7"></a-light>
        <a-light type="directional" position="1 1 1" intensity="0.8"></a-light>

        <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
        
        <a-entity camera look-controls position="0 1.6 0"></a-entity>
    </a-scene>

</body>
</html>
