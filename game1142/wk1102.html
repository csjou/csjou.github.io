<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>wk1102 周重石  Keyboard 自定義元件測試</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <script>
      // 1. 註冊自定義元件：必須在 <a-scene> 渲染前註冊
        AFRAME.registerComponent("keyboard-move", {
            init() {
                window.addEventListener("keydown", e => {
                    if (e.key === "w") this.el.object3D.position.z -= 0.1;
                });
            }
        });

    </script>
</head>
<body>
    <a-scene>
        <a-sky color="#ECECEC"></a-sky>
        <a-box position="0 0 -5" color="red"></a-box>
        <a-box position="0 1 -3"
               rotation="0 45 0"
               color="#4CC3D9"
               keyboard-move>
        </a-box>

        <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
    </a-scene>
</body>
</html>
