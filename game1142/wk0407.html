<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>A-Frame a-minin練習</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-layout-component@5.3.0/dist/aframe-layout-component.min.js"></script>
</head>

<body>
    <a-scene>
        <a-assets>
            <a-mixin id="pillar" geometry="primitive: cylinder; radius: 0.2; height: 3" material="color: red"
                shadow></a-mixin>
        </a-assets>

        <a-entity layout="type: line; margin: 2" position="-4 1.5 -5">
            <a-entity mixin="pillar"></a-entity>
            <a-entity mixin="pillar"></a-entity>
            <a-entity mixin="pillar"></a-entity>
            <a-entity mixin="pillar"></a-entity>
            <a-entity mixin="pillar"></a-entity>
        </a-entity>
    </a-scene>
</body>

</html>
