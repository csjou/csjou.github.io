<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unit08 Example 01</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
<a-scene shadow="type: basic">
  <a-box position="0 1 -3" color="red" shadow></a-box>
  <a-plane rotation="-90 0 0" width="10" height="10" color="#7BC8A4" shadow></a-plane>
  <a-entity light="type: directional; intensity: 0.8" position="1 4 2" castShadow="true"></a-entity>
  <a-sky color="#ECECEC"></a-sky>
</a-scene>
</body>
</html>
