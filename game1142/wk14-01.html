<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unit14 Example 01</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.rawgit.com/IdeaSpaceVR/aframe-particle-system-component/master/dist/aframe-particle-system-component.min.js"></script>
</head>
<body>
<a-scene>
  <a-entity particle-system="preset: snow; particleCount: 2000;"></a-entity>
  <a-plane rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
  <a-sky color="#ECECEC"></a-sky>
</a-scene>
</body>
</html>
