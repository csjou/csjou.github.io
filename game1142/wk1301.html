<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周重石 wk1301 AR.js 相機測試</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://ar-js-org.github.io/AR.js/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <a-scene embedded arjs="sourceType: webcam; debugPanelEnabled: false;" vr-mode-ui="enabled: false">

        <a-marker preset="hiro">
            <a-box position="0 0.5 0" material="color: yellow; opacity: 0.8;"></a-box>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
