<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene shadow="type: pcfsoft">
      
      <a-entity light="type: ambient; color: #222"></a-entity>

      <a-entity id="dLight" light="type: directional; intensity: 0.8; castShadow: true" 
                position="5 3 1"></a-entity>

      <a-cylinder height="2" radius="0.5" position="0 1 -3" 
                  color="#FF9500" shadow="cast: true; receive: true">
      </a-cylinder>
      
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" 
               color="#333" shadow="receive: true"></a-plane>

      <a-sky color="#111"></a-sky> </a-scene>
  </body>
</html>
