<!DOCTYPE html>
<html>
  <head>
    <title>A-Frame .NET 8 Test</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene>
        <a-box position="0 1 -3" color="red"></a-box>
        <a-sphere position="0 3 -5" radius="1.25" color="green"></a-sphere>
        <a-plane rotation="-90 0 0" width="20" height="20" color="yellow"></a-plane>
        <a-sky color="blue"></a-sky>
        <a-entity camera look-control position="0 3.0 20"/>
    </a-scene>

  </body>
</html>
