<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-layout-component@5.3.0/dist/aframe-layout-component.min.js"></script>
    <script src="https://unpkg.com/aframe-randomizer-components@3.0.2/dist/aframe-randomizer-components.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-mixin id="randomBox" 
                 geometry="primitive: box"
                 random-position="min: -0.2 -0.2 -0.2; max: 0.2 0.2 0.2"
                 random-color
                 random-scale="min: 0.5 0.5 0.5; max: 1.5 1.5 1.5">
        </a-mixin>
      </a-assets>

      <a-entity layout="type: line; margin: 2" position="-9 1.5 -10">
        <a-entity mixin="randomBox"></a-entity>
        <a-entity mixin="randomBox"></a-entity>
        <a-entity mixin="randomBox"></a-entity>
        <a-entity mixin="randomBox"></a-entity>
        <a-entity mixin="randomBox"></a-entity>
        <a-entity mixin="randomBox"></a-entity>
        <a-entity mixin="randomBox"></a-entity>
        <a-entity mixin="randomBox"></a-entity>
        <a-entity mixin="randomBox"></a-entity>
        <a-entity mixin="randomBox"></a-entity>
      </a-entity>

      <a-sky color="#020202"></a-sky>
    </a-scene>
  </body>
