<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame 圓周分佈與循環變色</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>

    <a-scene>
        <a-entity id="box-container"></a-entity>

        <a-sky color="#222"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="120" height="120" color="#333"></a-plane>

        <a-entity camera look-controls position="0 1.6 0">
            <a-entity cursor="rayOrigin: mouse"></a-entity>
        </a-entity>
    </a-scene>

    <script>
      const container = document.querySelector("#box-container");
      const numBoxes = 28;
      const radius = 5; // 設定半徑為 5 (可依需求調整大小)

      // 定義顏色循環陣列
      const colors = ["red", "orange", "yellow", "green", "blue", "indigo", "purple"];

      for (let i = 0; i < numBoxes; i++) {
        // 1. 計算角度 (弧度)
        const angle = (i / numBoxes) * Math.PI * 2;

        // 2. 計算 XZ 平面座標
        const x = radius * Math.sin(angle);
        const z = radius * Math.cos(angle);

        // 3. 建立 a-box 元素
        const box = document.createElement("a-box");
        box.setAttribute("position", `${x} 0.5 ${z}`); // 高度設為 0.5 讓他站在平面上
        box.setAttribute("color", "#CCC");
        box.setAttribute("scale", "0.5 0.5 0.5");

        // 讓方塊面向中心點 (看起來比較整齊)
        box.setAttribute("rotation", `0 ${(angle * 180) / Math.PI} 0`);

        // 4. 點擊邏輯：使用 dataset 紀錄當前的顏色索引
        box.dataset.colorIndex = -1;

        box.addEventListener("click", function() {
          // 取得下一個索引並循環 (0-6)
          let nextIndex = (parseInt(this.dataset.colorIndex) + 1) % colors.length;
          this.dataset.colorIndex = nextIndex;

          // 變更顏色
          this.setAttribute("color", colors[nextIndex]);

          // 添加一個縮放小動畫回饋感
          this.setAttribute("animation", {
            property: 'scale',
            to: '0.6 0.6 0.6',
            dur: 100,
            dir: 'alternate',
            loop: 2
          });
        });

        container.appendChild(box);
      }
    </script>
</body>
</html>
