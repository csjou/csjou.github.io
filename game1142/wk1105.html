<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame 5x5 三角錐陣列</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script>
        AFRAME.registerComponent("spin", {
            schema: { speed: { type: "number", default: 1 } },
            tick(t, dt) { this.el.object3D.rotation.y += dt / 1000 * this.data.speed; }
        });

        // 1105-2
        AFRAME.registerComponent("rndcolor", {
            tick() {
                const randomColor = "#" + (Math.random() * 0xFFFFFF << 0).toString(16);
                this.el.setAttribute('color', randomColor);
            }
        });
        // 1105-2
        AFRAME.registerComponent("move-down", {
            tick() { this.el.object3D.position.y -= 0.01; }
        });
    
        // 註冊一個控制場景生成的元件
        AFRAME.registerComponent('cone-grid', {
            init: function () {
                const sceneEl = this.el; // 取得場景元素
                const spacing = 1.5;    // 錐體之間的間隔
                const offset = 2;       // 偏移量，讓 5x5 陣列中心對準原點 ( (5-1)*1.5 / 2 )

                for (let i = 0; i < 5; i++) {       // X 軸循環
                    for (let j = 0; j < 5; j++) {     // Y 軸循環
                        // 1. 建立一個三角錐實體
                        const cone = document.createElement('a-box');

                        // 2. 計算位置
                        // x = (i * 間隔) - 偏移
                        // y = (j * 間隔) - 偏移 + 1.6 (1.6 是人眼平均高度)
                        // z = -5 (距離 5 公尺遠)
                        const posX = (i * spacing) - 3;
                        const posY = (j * spacing) + 0.5;
                        const posZ = -5;

                        // 3. 設定屬性
                        cone.setAttribute('position', `${posX} ${posY} ${posZ}`);
                        cone.setAttribute('radius-bottom', '0.5');
                        cone.setAttribute('height', '1');
                        // 4. 將三角錐加move-down
                        cone.setAttribute('move-down', '');
                        cone.setAttribute('rndcolor', '');
                        // 隨機旋轉讓畫面更有趣
                        const randomspin = (0.1 + Math.random() *20).toString();
                       
                        cone.setAttribute('spin', { speed: randomspin });
                        // 4. 將三角錐加入場景
                        sceneEl.appendChild(cone);
                        
                    }
                }
            }
        });
    </script>
</head>
<body>
    <a-scene cone-grid>
        <a-sky color="#222"></a-sky>
        <a-box position="0 5 -4" color="red" move-down></a-box>
        <a-light type="ambient" color="#BBB"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.6" position="-1 1 1"></a-light>

        <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    </a-scene>
</body>
</html>
