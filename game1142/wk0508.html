<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>092012 wK0508 layout code</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>

<body>

  <script>
    /**
     * 模擬 WinForm 的初始化機制
     */
    function InitializeComponent() {
      // 1. 建立 Scene (相當於 Form 本體)
      const scene = document.createElement('a-scene');
      // --- 1. 建立相機與游標 (必須有 Cursor 才能點擊) ---
      const cameraEntity = document.createElement('a-entity');
      cameraEntity.setAttribute('camera', '');
      cameraEntity.setAttribute('look-controls', '');
      cameraEntity.setAttribute('position', '0 1.6 0');

      const cursor = document.createElement('a-cursor'); // 畫面中央的小圓點
      cameraEntity.appendChild(cursor);
      scene.appendChild(cameraEntity);


      // 2. 建立 Box (方塊)
      for (let i = 0; i < 5; i++) {
        for (let j = 0; j < 5; j++) {
          // 計算 x：從 -5 開始，每次增加 2.5
          let x = -5 + (i * 2.5);
          let y = -5 + (j * 2.5)
          const box = document.createElement('a-box');
          box.setAttribute('position', x + ' ' + y + ' -3');
          box.setAttribute('rotation', '0 45 0');
          box.setAttribute('scale', '0.8 0.8 0.8');
          box.setAttribute('color', '#4CC3D9');
          // 監聽滑鼠移入 (Mouse Enter)
          box.addEventListener('mouseenter', function () {
            // 放大方塊
            this.setAttribute('scale', '1.2 1.2 1.2');
            console.log('滑鼠進來了！');
          });

          // 監聽滑鼠移出 (Mouse Leave)
          box.addEventListener('mouseleave', function () {
            // 恢復原始大小
            this.setAttribute('scale', '1 1 1');
            // 直接設為 false，方塊就會消失
            this.setAttribute('visible', false);
            console.log('滑鼠離開了！');
          });
          scene.appendChild(box);
        }
      }



      // 最後將整個場景掛載到 body
      document.body.appendChild(scene);
    }

    // 當頁面載入時執行初始化
    window.onload = InitializeComponent;
  </script>

</body>

</html>
