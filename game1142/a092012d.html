<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>a092012d</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>


</head>

<body>
    <a-scene>
        <a-entity camera look-controls position="0 1.6 0">
            <a-cursor></a-cursor>
        </a-entity>
    </a-scene>
    <script>
        const sphere = document.createElement('a-sphere');
        sphere.setAttribute('position', '0 1.25 -5');
        sphere.setAttribute('src', 'cubic.jpg');

        // 設定動畫屬性與觸發事件
        sphere.setAttribute('animation__click', {
            property: 'rotation',
            from: '0 0 0',      // 強制重置起始狀態以利重複執行
            to: '0 360 0',
            dur: 1000,
            startEvents: 'click'
        });
        document.querySelector('a-scene').appendChild(sphere);

    </script>
</body>

</html>
