<!-- index.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毒化物 GIS 地圖</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
}
#map{
    width:100%;
    height:100%;
}
.info{
    position:absolute;
    top:10px;
    left:10px;
    z-index:999;
    background:white;
    padding:10px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.25);
    font-size:14px;
}
</style>
</head>

<body>

<div class="info">
<b>毒性化學物質 GIS 地圖</b><br>
紅點 = 儲存場所<br>
紅圈 = 100 公尺管制區
</div>

<div id="map"></div>

<script>

// 初始化地圖（板橋）
var map = L.map('map').setView([25.0143,121.4672], 12);

// OSM 圖層
L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom:19,
    attribution:'© OpenStreetMap'
}).addTo(map);


// 讀取 GeoJSON
fetch('toxic_chemicals.geojson')
.then(response => response.json())
.then(data => {

    let group = L.layerGroup();

    L.geoJSON(data, {

        pointToLayer: function(feature, latlng){

            // 紅色標記點
            let marker = L.circleMarker(latlng,{
                radius:8,
                color:'red',
                fillColor:'red',
                fillOpacity:0.9,
                weight:1
            });

            return marker;
        },

        onEachFeature: function(feature, layer){

            let p = feature.properties;

            let html =
                "<b>" + p.facility_name + "</b><br>" +
                "地址：" + p.address + "<br>" +
                "物質：<span style='color:red'>" +
                p.chemical_name +
                "</span>";

            layer.bindPopup(html);

            // 500m 圓形區塊
            // p.radius => 100

        
            let circle = L.circle(
                layer.getLatLng(),
                {
                    radius: 100,
                    color:'red',
                    weight:1,
                    fill:true,
                    fillColor:'red',
                    fillOpacity:0.20
                }
            );

            circle.bindTooltip(
                p.facility_name + " - 500公尺管制範圍"
            );

            group.addLayer(circle);
        }

    }).addTo(group);

    group.addTo(map);

})
.catch(err=>{
    console.log(err);
    alert("GeoJSON 載入失敗");
});

</script>

</body>
</html>
